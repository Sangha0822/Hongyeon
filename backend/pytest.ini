[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
# anyio (installed with FastAPI) ships its own async plugin; pytest-asyncio does that job here.
addopts = -p no:anyio
# One event loop for the whole run: the database engine's connection pool belongs to the
# loop it was created on, and a new loop per test would leave it pointing at a closed one.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
